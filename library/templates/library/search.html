{% block content %}

<h2>Search</h2>

<form method="GET" action="/search/">
    <input type="text" name="q" value="{{ q }}">
    <button type="submit">Search</button>
</form>

<hr>

<ul>
    {% for book in results %}
        <li>{{ book.title }} by {{ book.author }}</li>
    {% empty %}
        <li>No results</li>
    {% endfor %}
</ul>

<div style="margin-bottom:20px;">
    <a href="{% url 'home' %}">&larr; Back to Home</a>
</div>

{% endblock %}
