<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .note {
            font-size: 12px;
            color: gray;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    <!-- CSFR token is required here to demonstrate priviledge elevation with as_user, without token this would require using GET -->
    
    <form method="post" action="/login/">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="text" name="password" placeholder="Password" required>

        <!-- dev code <input type="text" name="as_user" placeholder="(optional) as_user"> login as admin -->

        <button type="submit">Login</button>

        <button type="button"
            onclick="window.location.href='/change_password/'">
        Change Password
        </button>    
    </form>
</div>

</body>
</html>
